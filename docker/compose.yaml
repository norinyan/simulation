name: hfun-navi-simulation-nor

services:
  dev:
    image: hfun-navi-simulation-nor:humble

    build:
      context: .
      dockerfile: Dockerfile

    environment:
      DISPLAY: ${DISPLAY}
      ROS_DOMAIN_ID: "73"
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: graphics,utility,compute,display

    gpus: all
    shm_size: "1gb"

    volumes:
      - ..:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:ro

    working_dir: /workspace
    stdin_open: true
    tty: true
