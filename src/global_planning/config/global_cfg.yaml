# pose: [x, y, 地面高度 z, yaw]；world 坐标系，单位米、弧度。
planning:
  algorithm: pct                  # pct / mesh / gb；当前仅接入 pct
  start_source: preset            # preset / odom
  start: F1-ENTRY
  goal: F3-EAST
  plan_on_startup: false
  map_file: /workspace/build/pct_maps/three_floor_ideal.pctmap                    # 离线地图；相对路径基于本配置目录
  planning_timeout: 60.0          # 秒
  odom_timeout: 1.0               # 里程计接收后有效时间，墙钟秒

# PCT要求正尺寸：0.001仅为点模型数值占位，不代表方块外形。
constraints:
  length: 0.001
  width: 0.001
  safety_margin: 0.05
  max_step: 0.16
  clearance: 0.49  # 理想参考高度 .44 + 点障碍间距 .05

# 以下路径为项目 Docker 容器路径；预处理与节点读取同一份配置。
pct:
  world_file: /workspace/src/sim_bringup/worlds/three_floor.world
  ideal_config: /workspace/src/control/config/ideal.yaml
  map:
    resolution: 0.05
    slice_dh: 0.5
    safe_margin: 0.10
    kernel_size: 7
    interval_free_margin: 0.15
    slope_max: 0.4
    standable_ratio: 0.2
    cost_barrier: 50.0
  search:
    cost_threshold: 20.0
    step_cost_weight: 0.2
  optimizer:
    enabled: false
    max_heading_rate: 0.1
    cost_margin: 8.0
    jerk_sigma: 0.03
    sample_interval: 5
    iterations: 200

points:
  F1-ENTRY:
    label: F1-START · 一层门前
    pose: [0, -6.3, 0, 1.5707963267948966]
  F1-STAIR:
    label: F1-STAIR · 一层楼梯口
    pose: [-7.8625, 2.15, 0, 1.5707963267948966]
  F1-ROOM:
    label: F1-ROOM · 一层房间点
    pose: [6.0, 4.1, 0, 0]
  F2-STAIR:
    label: F2-STAIR · 二层楼梯口
    pose: [-7.8625, 2.15, 3.2, 1.5707963267948966]
  F2-ROOM:
    label: F2-ROOM · 二层房间点
    pose: [5.1, -3.65, 3.2, 1.5707963267948966]
  F2-EAST:
    label: F2-EAST · 二层走廊点
    pose: [8.1, 1.9, 3.2, 3.141592653589793]
  F3-STAIR:
    label: F3-STAIR · 三层楼梯口
    pose: [-7.8625, 2.15, 6.4, 1.5707963267948966]
  F3-EAST:
    label: F3-EAST · 三层走廊点
    pose: [8.1, 1.9, 6.4, 3.141592653589793]
  F3-WINDOW:
    label: F3-WINDOW · 三层窗前点
    pose: [0, -6.1, 6.4, -1.5707963267948966]
