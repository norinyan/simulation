algorithm: scan
map_file: /workspace/src/sim_bringup/worlds/three_floor.world
ideal_config: ""                # 空值读取 control/config/ideal.yaml
planning_range: 2.0             # 从预测切换位姿向前截取的参考弧长，m
replan_period: 0.5              # 仿真秒；运动中重新规划间隔
trajectory_lead_time: 0.5       # 仿真秒；提前预约轨迹切换，过期结果拒绝
planning_timeout: 5.0           # 墙钟秒
odom_timeout: 1.0               # 墙钟接收超时；不用于轨迹执行计时
linear_speed: 0.8               # 通用三维速度上限，m/s
angular_speed: 1.0              # yaw速度上限，rad/s
max_acceleration: 0.8           # 三维加速度上限，m/s²
point_clearance: 0.05           # 点轨迹到World障碍的最小距离，m

dynamic_obstacles:
  enabled: false
  expected_ids: [f1_crossing, f1_head_on, f2_follow, f2_blockage, f3_crossing, f3_head_on]
  observation_timeout: 0.3       # 仿真秒
  horizon: 20.0                 # 覆盖局部轨迹及停车末端，秒
  margin: 0.03                  # 额外预测余量，m
  margin_rate: 0.01             # 每预测一秒增加的余量，m/s

scan:
  resolution: 0.05
  control_spacing: 0.10
  sample_dt: 0.05
  clearance: 0.10               # 优化器避障代价距离，m
  smooth_weight: 1.0
  collision_weight: 2.0
  feasibility_weight: 1.0
  iterations: 200
