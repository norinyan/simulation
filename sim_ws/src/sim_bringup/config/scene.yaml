# Planning geometry, not a ROS parameter file or an algorithm configuration.
# Paths are relative to the sim_bringup package share/source directory.
# Future adapters may turn this data into grids, obstacle sets, or terrain data.
schema_version: 1
scene:
  name: two_steps
  frame: world
  units: {length: m, angle: rad}
  world_file: worlds/two_steps.world

  # [xmin, xmax, ymin, ymax], along the INNER faces of the perimeter walls.
  # lower_bounds describes the exposed lower surface, not the entire base slab.
  lower_bounds: [-6.85, 2.0, -3.825, 3.825]
  upper_bounds: [2.7, 11.35, -3.825, 3.825]
  ground_heights: {lower: 0.0, upper: 0.34}
  surfaces:
    base:
      name: lower_ground
      shape: box
      center: [2.25, 0.0, -0.10]
      size: [18.2, 7.65, 0.20]
    upper:
      name: upper_platform
      shape: box
      center: [7.025, 0.0, 0.17]
      size: [8.65, 7.65, 0.34]

  stair:
    start_x: 2.0
    center_y: 0.0
    count: 2
    rise: 0.17
    tread: 0.35
    width: 7.65
    # Full geometric passage; robot footprint and algorithm margins are not subtracted.
    passage_y: [-3.825, 3.825]
    steps:
      - name: step_1
        shape: box
        center: [2.175, 0.0, 0.085]
        size: [0.35, 7.65, 0.17]
        top_z: 0.17
      - name: step_2
        shape: box
        center: [2.525, 0.0, 0.17]
        size: [0.35, 7.65, 0.34]
        top_z: 0.34

  obstacles:
    - name: lower_obstacle_1
      shape: box
      center: [-2.0, 0.0, 0.40]
      size: [0.8, 0.8, 0.8]
    - name: upper_obstacle_1
      shape: box
      center: [5.8, 0.0, 0.74]
      size: [0.8, 0.8, 0.8]

  # Physical boundary geometry; adapters must retain these walls or enforce the bounds.
  walls:
    - {name: lower_left_wall, shape: box, center: [-2.5, 3.9, 0.5], size: [9.0, 0.15, 1.4]}
    - {name: lower_right_wall, shape: box, center: [-2.5, -3.9, 0.5], size: [9.0, 0.15, 1.4]}
    - {name: step_1_left_wall, shape: box, center: [2.175, 3.9, 0.5], size: [0.35, 0.15, 1.4]}
    - {name: step_1_right_wall, shape: box, center: [2.175, -3.9, 0.5], size: [0.35, 0.15, 1.4]}
    - {name: step_2_left_wall, shape: box, center: [2.525, 3.9, 0.5], size: [0.35, 0.15, 1.4]}
    - {name: step_2_right_wall, shape: box, center: [2.525, -3.9, 0.5], size: [0.35, 0.15, 1.4]}
    - {name: upper_left_wall, shape: box, center: [7.1, 3.9, 0.5], size: [8.8, 0.15, 1.4]}
    - {name: upper_right_wall, shape: box, center: [7.1, -3.9, 0.5], size: [8.8, 0.15, 1.4]}
    - {name: lower_end_wall, shape: box, center: [-6.925, 0.0, 0.5], size: [0.15, 7.65, 1.4]}
    - {name: upper_end_wall, shape: box, center: [11.425, 0.0, 0.5], size: [0.15, 7.65, 1.4]}

  # [x, y, ground_z, yaw]; these are ground projections, not base_link poses.
  # Gazebo discs are elevated by marker_z_offset to avoid z-fighting.
  marker_z_offset: 0.005
  waypoints:
    A: [-4.5, 0.0, 0.0, 0.0]
    E: [1.6, 0.0, 0.0, 0.0]
    X: [3.3, 0.0, 0.34, 0.0]
    B: [9.0, 0.0, 0.34, 0.0]

robot:
  name: wheel_leg_robot
  description_file: urdf/robot.urdf.xacro
  base_frame: base_link
  # Full collision footprint INCLUDING folded limbs/feet, in base_link XY.
  # No planner safety margin is included. Valid only for this zero-joint posture.
  wheel_mode_length: 0.54
  wheel_mode_width: 0.78
  reference_joint_positions:
    wheel_lift_joint: 0.0
    left_wheel_joint: 0.0
    right_wheel_joint: 0.0
    left_shoulder_joint: 0.0
    left_knee_joint: 0.0
    left_ankle_joint: 0.0
    right_shoulder_joint: 0.0
    right_knee_joint: 0.0
    right_ankle_joint: 0.0
  body_size: [0.54, 0.30, 0.18]
  wheel_radius: 0.14
  wheel_width: 0.08
  wheel_track: 0.42
  carrier_drop: 0.18
  lift_limits: [0.0, 0.22]
  upper_leg_length: 0.28
  lower_leg_length: 0.28
  leg_width: 0.035
  # Left shoulder relative to base_link; right shoulder mirrors the Y component.
  shoulder_offset: [0.04, 0.34, 0.06]
  # Fixed origin pitches; reference joint positions above add zero rotation.
  folded_shoulder_pitch: 1.15
  folded_knee_pitch: -2.30
  folded_ankle_pitch: 1.15
  leg_pitch_limits: [-1.57, 1.57]
  foot_size: [0.18, 0.10, 0.035]
  # Foot collision center relative to its ankle/foot link, not the foot tip.
  foot_center_offset_x: 0.0725
