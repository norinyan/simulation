# Planning geometry, not a ROS parameter file or an algorithm configuration.
# Paths are relative to the sim_bringup package share/source directory.
# Future adapters may turn this data into grids, obstacle sets, or terrain data.
schema_version: 1
scene:
  name: two_steps
  frame: world
  units: {length: m, angle: rad}
  world_file: worlds/two_steps.world
  # Existing wheel -> foot -> wheel task adapter; point names are data.
  task_route: [A, E, X, B]

  # [xmin, xmax, ymin, ymax], along the INNER faces of the perimeter walls.
  # lower_bounds describes the exposed lower surface, not the entire base slab.
  lower_bounds: [-6.85, 2.0, -3.825, 3.825]
  upper_bounds: [2.7, 11.35, -3.825, 3.825]
  ground_heights: {lower: 0.0, upper: 0.34}
  surfaces:
    base:
      name: lower_ground
      shape: box
      center: [2.25, 0.0, -0.10]
      size: [18.2, 7.65, 0.20]
    upper:
      name: upper_platform
      shape: box
      center: [7.025, 0.0, 0.17]
      size: [8.65, 7.65, 0.34]

  stair:
    start_x: 2.0
    center_y: 0.0
    count: 2
    rise: 0.17
    tread: 0.35
    width: 7.65
    # Full geometric passage; robot footprint and algorithm margins are not subtracted.
    passage_y: [-3.825, 3.825]
    steps:
      - name: step_1
        shape: box
        center: [2.175, 0.0, 0.085]
        size: [0.35, 7.65, 0.17]
        top_z: 0.17
      - name: step_2
        shape: box
        center: [2.525, 0.0, 0.17]
        size: [0.35, 7.65, 0.34]
        top_z: 0.34

  obstacles:
    - name: lower_obstacle_1
      shape: box
      center: [-2.0, 0.0, 0.40]
      size: [0.8, 0.8, 0.8]
    - name: upper_obstacle_1
      shape: box
      center: [5.8, 0.0, 0.74]
      size: [0.8, 0.8, 0.8]

  # Physical boundary geometry; adapters must retain these walls or enforce the bounds.
  walls:
    - {name: lower_left_wall, shape: box, center: [-2.5, 3.9, 0.5], size: [9.0, 0.15, 1.4]}
    - {name: lower_right_wall, shape: box, center: [-2.5, -3.9, 0.5], size: [9.0, 0.15, 1.4]}
    - {name: step_1_left_wall, shape: box, center: [2.175, 3.9, 0.5], size: [0.35, 0.15, 1.4]}
    - {name: step_1_right_wall, shape: box, center: [2.175, -3.9, 0.5], size: [0.35, 0.15, 1.4]}
    - {name: step_2_left_wall, shape: box, center: [2.525, 3.9, 0.5], size: [0.35, 0.15, 1.4]}
    - {name: step_2_right_wall, shape: box, center: [2.525, -3.9, 0.5], size: [0.35, 0.15, 1.4]}
    - {name: upper_left_wall, shape: box, center: [7.1, 3.9, 0.5], size: [8.8, 0.15, 1.4]}
    - {name: upper_right_wall, shape: box, center: [7.1, -3.9, 0.5], size: [8.8, 0.15, 1.4]}
    - {name: lower_end_wall, shape: box, center: [-6.925, 0.0, 0.5], size: [0.15, 7.65, 1.4]}
    - {name: upper_end_wall, shape: box, center: [11.425, 0.0, 0.5], size: [0.15, 7.65, 1.4]}

  # [x, y, ground_z, yaw]; these are ground projections, not base_link poses.
  # Gazebo discs are elevated by marker_z_offset to avoid z-fighting.
  marker_z_offset: 0.005
  waypoints:
    A: [-4.5, 0.0, 0.0, 0.0]
    E: [1.6, 0.0, 0.0, 0.0]
    X: [3.3, 0.0, 0.34, 0.0]
    B: [9.0, 0.0, 0.34, 0.0]

robot:
  execution:
    feedback_timeout: 1.0
    command_timeout: 0.8
    morph_duration: 4.0
    position_tolerance: 0.002
    yaw_tolerance: 0.0005
    approach_gain: 0.5
  name: wheel_leg_robot
  description_package: control
  description_file: urdf/robot.urdf.xacro
  base_frame: base_link
  # Full collision footprint INCLUDING folded limbs/feet, in base_link XY.
  # No planner safety margin is included. Valid only for this zero-joint posture.
  wheel_mode_length: 0.54
  wheel_mode_width: 0.78
  reference_joint_positions:
    wheel_lift_joint: 0.0
    left_wheel_joint: 0.0
    right_wheel_joint: 0.0
    left_shoulder_joint: 0.0
    left_hip_yaw_joint: 0.0
    left_knee_joint: 0.0
    left_ankle_joint: 0.0
    right_shoulder_joint: 0.0
    right_hip_yaw_joint: 0.0
    right_knee_joint: 0.0
    right_ankle_joint: 0.0
  # Common macro traversal constraints, separate from algorithm parameters.
  traversal:
    max_step_height: 0.17
    min_tread: 0.18
    body_ground_clearance: 0.34  # 0.43 m foot body height minus half body thickness.
  body_size: [0.54, 0.30, 0.18]
  wheel_radius: 0.14
  wheel_width: 0.08
  wheel_track: 0.42
  carrier_drop: 0.18
  lift_limits: [0.0, 0.22]
  upper_leg_length: 0.28
  lower_leg_length: 0.28
  leg_width: 0.035
  # Left shoulder relative to base_link; right shoulder mirrors the Y component.
  shoulder_offset: [0.04, 0.34, 0.06]
  # Fixed origin pitches; reference joint positions above add zero rotation.
  folded_shoulder_pitch: 1.15
  folded_knee_pitch: -2.30
  folded_ankle_pitch: 1.15
  leg_pitch_limits: [-1.57, 1.57]
  hip_yaw_limits: [-1.57, 1.57]
  foot_size: [0.18, 0.10, 0.035]
  # Foot collision center relative to its ankle/foot link, not the foot tip.
  foot_center_offset_x: 0.0725

# Shared robot geometry above; scene-specific data contains no furniture copy.
scenes:
  three_floor:
    name: three_floor
    frame: world
    units: {length: m, angle: rad}
    world_file: worlds/three_floor.world
    live_geometry: true
    task_type: wheel_navigation
    task_route: [start, goal]
    floors: [0.0, 3.2, 6.4]
    navigation:
      position_tolerance: 0.03
      yaw_tolerance: 0.04
      approach_gain: 1.0
      wait_timeout: 90.0
      obstacle_timeout: 0.5

# Ground poses [x, y, z, yaw], metres/radians; task support is explicit.
# F1 entrance uses the inner doorstep: outside the main door has no supporting slab.
presets:
  two_steps:
    label: 两级台阶
    default_start: A
    default_goal: B
    points:
      A:
        label: A · 下层起点
        pose: [-4.5, 0.0, 0.0, 0.0]
      E:
        label: E · 楼梯入口
        pose: [1.6, 0.0, 0.0, 0.0]
      X:
        label: X · 楼梯出口
        pose: [3.3, 0.0, 0.34, 0.0]
      B:
        label: B · 上层终点
        pose: [9.0, 0.0, 0.34, 0.0]
    executable_routes: [[A, B]]
  three_floor:
    all_point_navigation: true
    max_navigation_factor: 5
    label: 三层楼
    default_start: F1-ENTRY
    default_goal: F1-ROOM
    points:
      F1-ENTRY:
        label: F1-ENTRY · 一层大门前（内侧）
        pose: [0, -6.3, 0, 1.5707963267948966]
      F1-STAIR:
        label: F1-STAIR · 一层楼梯口前
        pose: [-7.8625, 2.15, 0, 1.5707963267948966]
      F1-ROOM:
        label: F1-ROOM · 一层右上角房间内
        pose: [6.0, 4.1, 0, 0]
      F2-STAIR:
        label: F2-STAIR · 二层楼梯口前
        pose: [-7.8625, 2.15, 3.2, 1.5707963267948966]
      F2-ROOM:
        label: F2-ROOM · 二层右下角房间内
        # 15 cm away from the north wall permits a swept turn at the same room stop.
        pose: [5.1, -3.65, 3.2, 1.5707963267948966]
      F2-EAST:
        label: F2-EAST · 二层走廊最右端
        pose: [8.1, 1.9, 3.2, 3.141592653589793]
      F3-STAIR:
        label: F3-STAIR · 三层楼梯口前
        pose: [-7.8625, 2.15, 6.4, 1.5707963267948966]
      F3-EAST:
        label: F3-EAST · 三层走廊最右端
        pose: [8.1, 1.9, 6.4, 3.141592653589793]
      F3-WINDOW:
        label: F3-WINDOW · 三层中间下方窗前
        pose: [0, -6.1, 6.4, -1.5707963267948966]
    executable_routes: []  # All distinct point pairs use the unified backend.
