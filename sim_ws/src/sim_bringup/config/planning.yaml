planning_node:
  ros__parameters:
    resolution: 0.05       # A* grid spacing, metres
    safety_margin: 0.05    # Additional footprint clearance, metres
    max_grid_cells: 2000000
    teb:
      max_v: 0.30
      max_w: 0.80
      max_a: 0.30
      max_alpha: 1.0
      safety_margin: 0.05
      time_horizon: 6.0       # Seconds per rolling prediction.
      spacing: 0.15
      iterations: 30
      solver_time_limit: 0.10
      max_lateral_velocity: 0.01
      collision_translation_step: 0.01
      collision_rotation_step: 0.02
    foot:
      resolution: 0.05
      max_step: 0.50
      edge_margin: 0.025
      swing_clearance: 0.08
      step_duration: 4.5      # Matches the URDF leg joint limit of 2 rad/s.
      sample_dt: 0.02
      max_foot_v: 0.8
      max_foot_a: 3.0
      max_body_v: 0.3
      max_body_a: 1.0
      max_joint_v: 2.0
      max_joint_a: 20.0
      body_height: 0.43       # base_link height above support ground.
      wheel_lift: 0.13
      max_expansions: 10000
    task:
      feedback_timeout: 1.0
      command_timeout: 0.8
      stage_timeout: 240.0
      timeout: 600.0
      morph_duration: 4.0
      position_tolerance: 0.002
      yaw_tolerance: 0.0005
      approach_gain: 0.5    # Terminal speed cap = gain * measured goal distance.
